name: Private Credit Quant Data Auto Analysis Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 */3 * *'

# 🔑 [추가됨] GitHub Actions에 명시적 권한 부여
permissions:
  contents: write

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline Main Script
        run: python main.py

      - name: Commit and Push Updated Reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          git diff-index --quiet HEAD || git commit -m "chore: auto-update quantitative analysis report"
          git push

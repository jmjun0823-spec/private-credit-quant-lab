name: Private Credit Quant Data Auto Analysis Pipeline

on:
workflow_dispatch:
schedule:
- cron: '0 0 */3 * *' # 3일에 한 번씩 자동 갱신 및 입증 데이터 빌드

jobs:
build-and-analyze:
runs-on: ubuntu-latest

steps:
  - name: Repository Checkout
    uses: actions/checkout@v3

  - name: Python 3.10 Setup
    uses: actions/setup-python@v4
    with:
      python-version: '3.10'

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Run Pipeline Main Script
    run: python main.py

  - name: Commit and Push Updated Reports
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add outputs/ generated_report.md outputs/*.png
      git commit -m "chore: 블로그 입증용 최신 퀀트 데이터 및 차트 자동 갱신 [skip ci]" || exit 0
      git push
